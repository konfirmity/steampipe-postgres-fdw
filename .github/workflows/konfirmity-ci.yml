# Konfirmity fork only: upstream's test.yml checks out turbot/steampipe-postgres-fdw rather than the
# commit under test, so it cannot test a fork branch. This runs the hub unit tests and builds the FDW
# against PostgreSQL 14, the version steampipe-proxy runs.
name: Konfirmity CI

on:
  push:
    branches: ["konfirmity/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL 14 server headers
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-server-dev-14
          echo "/usr/lib/postgresql/14/bin" >> "$GITHUB_PATH"

      - name: Hub unit tests
        run: go test -race -count=1 ./hub/

      - name: Build the FDW
        run: make build with_llvm=no
